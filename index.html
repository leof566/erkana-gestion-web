function renderOrders(){let list=orders().filter(o=>(orderStatus==='todos'||o.status===orderStatus)&&(orderBrand==='todos'||o.brandId===orderBrand)&&[o.customer,o.phone,o.number,...(o.items||[]).map(it=>it.name)].join(' ').toLowerCase().includes(orderQuery.toLowerCase())).sort((a,b)=>b.updatedAt-a.updatedAt);app.innerHTML=`<div class="heading-row"><div><div class="eyebrow">AGENDA COMERCIAL</div><p class="section-text">Presupuestos, pedidos, producción, entregas y cobros.</p></div><button class="btn btn-primary" data-action="new-order">＋ Nuevo pedido</button></div><div class="panel"><div class="toolbar"><div class="search"><input id="orderSearch" placeholder="Buscar cliente, producto o número" value="${esc(orderQuery)}"></div><select id="orderStatus">${opts([{value:'todos',label:'Todos los estados'},...Object.entries(STATUSES).map(([value,label])=>({value,label}))],orderStatus)}</select><select id="orderBrand">${opts(selectBrands(true),orderBrand)}</select><button data-action="export-orders" class="btn btn-outline">↓ CSV</button></div><div class="subtle" style="margin-bottom:11px">${list.length} pedido(s) encontrados</div>${orderTable(list)}</div>`;$('#orderSearch').addEventListener('input',e=>{orderQuery=e.target.value;const pos=e.target.selectionStart;renderOrders();$('#orderSearch').focus();$('#orderSearch').setSelectionRange(pos,pos)});$('#orderStatus').onchange=e=>{orderStatus=e.target.value;renderOrders()};$('#orderBrand').onchange=e=>{orderBrand=e.target.value;renderOrders()}}

</div>`:empty('◈','Tu catálogo está vacío','Agregá un producto, material o servicio para empezar.')}</div><p class="hint">Stock disponible = stock inicial + movimientos de reposición − cantidades de pedidos confirmados. Los presupuestos y pedidos cancelados no descuentan stock. Si vendés servicios, desactivá el control de stock.</p>`;$('#productSearch').oninput=e=>{productQuery=e.target.value;const p=e.target.selectionStart;renderProducts();$('#productSearch').focus();$('#productSearch').setSelectionRange(p,p)};$('#productBrand').onchange=e=>{productBrand=e.target.value;renderProducts()}}
function renderCalendar(){const year=monthCursor.getFullYear(),month=monthCursor.getMonth(),first=new Date(year,month,1),start=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),count=Math.ceil((start+days)/7)*7;const lookup={};orders().forEach(o=>{if(!o.dueDate||['cancelado','presupuesto'].includes(o.status))return;(lookup[o.dueDate]??=[]).push(o)});const today=localDay();const dayOrders=(lookup[selectedDay]||[]).sort((a,b)=>a.status.localeCompare(b.status));app.innerHTML=`<div class="heading-row"><div><div class="eyebrow">PLANIFICACIÓN</div><p class="section-text">Visualizá vencimientos y organizá las entregas por fecha.</p></div><button class="btn btn-primary" data-action="new-order">＋ Agendar pedido</button></div><div class="calendar-shell"><div class="panel"><div class="calendar-head"><div><h3 style="font-size:18px;text-transform:capitalize">${monthCursor.toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</h3><small>${orders().filter(o=>o.dueDate?.slice(0,7)===localDay(monthCursor).slice(0,7)).length} pedidos con fecha</small></div><div class="calendar-controls"><button class="icon-btn" data-action="prev-month">‹</button><button class="btn btn-outline btn-small" data-action="this-month">Hoy</button><button class="icon-btn" data-action="next-month">›</button></div></div><div class="week-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div>${d}</div>`).join('')}</div><div class="month-grid">${Array.from({length:count},(_,idx)=>{const d=new Date(year,month,idx-start+1),date=localDay(d),found=lookup[date]||[];return `<button class="day ${d.getMonth()!==month?'faded':''} ${date===today?'today':''} ${date===selectedDay?'selected':''}" data-action="select-day" data-date="${date}"><span class="day-number">${d.getDate()}</span>${found.length?`<span class="day-count">${found.length} entrega${found.length===1?'':'s'}</span><span class="day-dots">${found.slice(0,4).map(o=>`<span style="background:${STATUS_COLORS[o.status]}"></span>`).join('')} function renderCalculator(){app.innerHTML=`<div class="heading-row"><div><div class="eyebrow">HERRAMIENTAS PARA VENDER MEJOR</div><p class="section-text">Calculá tu precio de venta incluyendo material, mano de obra, gastos y ganancia.</p></div></div><div class="dashboard-grid"><div class="panel"><h3 style="margin-bottom:17px">Simulador de precio</h3><div class="form-grid cols-3">${field('Costo de material (total)','calcMat',0,'number','min="0" step="0.01"')}${field('Mano de obra (total)','calcLabor',0,'number','min="0" step="0.01"')}${field('Otros gastos (total)','calcExtra',0,'number','min="0" step="0.01"')}${field('Cantidad de unidades','calcQty',1,'number','min="1" step="1"')}${field('Recargo sobre costo (%)','calcMarkup',50,'number','min="0" step="0.1"')}${field('Comisión / gastos de cobro (%)','calcFee',0,'number','min="0" max="99" step="0.1"')}</div><div class="sync-warning">El <b>recargo</b> es un porcentaje sobre tus costos, no un margen sobre el precio final. Si cobrás comisión por tarjeta o plataforma, se descuenta del precio cobrado.</div><div class="modal-actions"><button class="btn btn-outline" id="resetCalc">Reiniciar</button><button class="btn btn-primary" id="calcToOrder">Usar en nuevo pedido →</button></div></div><div class="panel"><div class="eyebrow">PRECIO RECOMENDADO</div><div style="font-size:38px;font-weight:900;letter-spacing:-1.5px;margin:17px 0 3px" id="calcPrice">${money(0)}</div><div class="subtle">Por unidad</div><div class="divider"></div><div class="info-row"><span>Costo total del trabajo</span><strong id="calcTotalCost">${money(0)}</strong></div><div class="info-row"><span>Costo por unidad</span><strong id="calcUnitCost">${money(0)}</strong></div><div class="info-row"><span>Precio total sugerido</span><strong id="calcTotalSale">${money(0)}</strong></div><div class="info-row"><span>Comisión estimada</span><strong id="calcCommission">${money(0)}</strong></div><div class="info-row"><span>Ganancia estimada total</span><strong id="calcProfit">${money(0)}</strong></div><p class="hint">El precio sugerido se redondea al peso más cercano. Podés ajustarlo manualmente en cada pedido.</p></div></div>`;$$('[id^="calc"]').filter(el=>el.tagName==='INPUT').forEach(el=>el.addEventListener('input',recalcPrice));$('#resetCalc').onclick=()=>{['calcMat','calcLabor','calcExtra','calcFee'].forEach(x=>$('#'+x).value=0);$('#calcQty').value=1;$('#calcMarkup').value=50;recalcPrice()};$('#calcToOrder').onclick=()=>{const c=calcPrice();openOrder(null,null,{name:'Trabajo personalizado',qty:c.qty,unitPrice:c.unitPrice,unitCost:c.unitCost})};recalcPrice()}
function calcPrice(){const qty=Math.max(1,Math.floor(n0($('#calcQty').value)||1));const totalCost=n0($('#calcMat').value)+n0($('#calcLabor').value)+n0($('#calcExtra').value);const unitCost=totalCost/qty,markup=n0($('#calcMarkup').value)/100,fee=Math.min(.99,n0($('#calcFee').value)/100),unitPrice=Math.round(unitCost*(1+markup)/(1-fee));return{qty,totalCost,unitCost,unitPrice,totalSale:unitPrice*qty,commission:unitPrice*qty*fee,profit:unitPrice*qty*(1-fee)-totalCost}}
function recalcPrice(){const c=calcPrice();$('#calcPrice').textContent=money(c.unitPrice);$('#calcTotalCost').textContent=money(c.totalCost);$('#calcUnitCost').textContent=money(c.unitCost);$('#calcTotalSale').textContent=money(c.totalSale);$('#calcCommission').textContent=money(c.commission);$('#calcProfit').textContent=money(c.profit)}
function renderReports(){const data=orders().filter(o=>!['cancelado','presupuesto'].includes(o.status));const filtered=data.filter(o=>reportPeriod==='todo'||(reportPeriod==='mes'?(o.orderDate||localDay(new Date(o.createdAt))).slice(0,7)===currentMonth():(o.orderDate||localDay(new Date(o.createdAt))).slice(0,4)===String(new Date().getFullYear())));const sold=filtered.reduce((s,o)=>s+orderCalc(o).total,0),deposit=filtered.reduce((s,o)=>s+Math.min(orderCalc(o).total,orderCalc(o).deposit),0),profit=filtered.reduce((s,o)=>s+orderCalc(o).profit,0),byBrand=db.brands.map(b=>({name:b.name,value:filtered.filter(o=>o.brandId===b.id).reduce((s,o)=>s+orderCalc(o).total,0)}));const max=Math.max(1,...byBrand.map(x=>x.value));app.innerHTML=`<div class="heading-row"><div><div class="eyebrow">RESULTADOS COMERCIALES</div><p class="section-text">Ventas registradas, cobros, costos y resultados estimados.</p></div><select style="max-width:205px" id="reportPeriod">${opts([{value:'mes',label:'Mes actual'},{value:'anio',label:'Año actual'},{value:'todo',label:'Todo el historial'}],reportPeriod)}</select></div><div class="stat-grid"><div class="stat-card"><div class="stat-top">Pedidos <span class="stat-icon">▤</span></div><div class="stat-value">${filtered.length}</div><div class="stat-foot">Confirmados y no cancelados</div></div><div class="stat-card"><div class="stat-top">Importe vendido <span class="stat-icon">$</span></div><div class="stat-value">${money(sold)}</div><div class="stat-foot">Total de los pedidos</div></div><div class="stat-card"><div class="stat-top">Señas registradas <span class="stat-icon">↗</span></div><div class="stat-value">${money(deposit)}</div><div class="stat-foot">Pagos iniciales ingresados</div></div><div class="stat-card"><div class="stat-top">Ganancia estimada <span class="stat-icon">◈</span></div><div class="stat-value">${money(profit)}</div><div class="stat-foot">Sin impuestos ni costos no cargados</div></div></div><div class="section-heading"><h3>Distribución y detalle</h3></div><div class="report-layout"><div class="panel"><h3>Facturación por marca</h3><p class="section-text">Comparación de los cuatro emprendimientos</p>${byBrand.map(x=>`<div class="report-bar"><span>${esc(x.name)}</span><div class="progress-bar"><div style="width:${Math.min(100,100*x.value/max)}%"></div></div><strong>${money(x.value)}</strong></div>`).join('')}</div><div class="panel"><h3>Información importante</h3><div class="info-row"><span>Pedidos entregados</span><strong>${filtered.filter(o=>o.status==='entregado').length}</strong></div><div class="info-row"><span>Pedidos en producción</span><strong>${filtered.filter(o=>o.status==='proceso').length}</strong></div><div class="info-row"><span>Saldos por cobrar</span><strong>${money(filtered.reduce((s,o)=>s+orderCalc(o).balance,0))}</strong></div><div class="info-row"><span>Costo directo estimado</span><strong>${money(filtered.reduce((s,o)=>s+orderCalc(o).cost,0))}</strong></div><p class="hint">Los montos corresponden a pedidos registrados por fecha de creación, no a un informe contable o facturación fiscal.</p></div></div>`;$('#reportPeriod').onchange=e=>{reportPeriod=e.target.value;renderReports()}}
function openProduct(id=null){const p=id?products().find(x=>x.id===id):null;openModal(p?'Editar producto':'Agregar producto o servicio',`<form id="productForm"><div class="form-grid">${field('Nombre del producto / servicio *','pName',p?.name||'','text','required maxlength="160"')}${field('Código / SKU','pSku',p?.sku||'','text','maxlength="70"')}${sfield('Emprendimiento','pBrand',selectBrands(),p?.brandId||db.brands[0].id)}${field('Categoría o tipo','pCategory',p?.category||'')}${field('Costo unitario ($)','pCost',p?.cost??0,'number','min="0" step="0.01"')}${field('Precio de venta ($)','pPrice',p?.price??0,'number','min="0" step="0.01"')}<div class="span-2 field"><label for="pDesc">Descripción / medidas / material</label><textarea id="pDesc" rows="3" placeholder="Ej.: Remera algodón, estampa 30 x 35 cm...">${esc(p?.description||'')}</textarea></div></div><div class="form-section"><label class="checkbox-field"><input type="checkbox" id="pTrack" ${p?.trackStock?'checked':''}> Activar control de stock (desactivar para servicios personalizados)</label><div class="form-grid" style="margin-top:15px">${field('Stock inicial (unidades)','pStock',p?.stock??0,'number','min="0" step="0.01"')}${field('Alerta de stock mínimo','pMin',p?.minStock??2,'number','min="0" step="0.01"')}</div><p class="hint">El stock inicial representa el inventario con el que empezás. Para incorporar mercadería después, usá el botón de reposición (＋), así queda registrado cada movimiento.</p></div><div class="modal-actions">${p?`<button type="button" class="btn btn-danger" id="pDelete">Eliminar</button>`:''}<button type="button" class="btn btn-outline" id="cancelProduct">Cancelar</button><button class="btn btn-primary" type="submit">Guardar producto</button></div></form>`);$('#cancelProduct').onclick=closeModal;if(p)$('#pDelete').onclick=()=>deleteProduct(p.id);$('#productForm').onsubmit=e=>{e.preventDefault();const name=$('#pName').value.trim();if(!name)return toast('Ingresá el nombre del producto','error');const now=Date.now();const obj={id:p?.id||uid(),name,sku:$('#pSku').value.trim(),brandId:$('#pBrand').value,category:$('#pCategory').value.trim(),cost:n0($('#pCost').value),price:n0($('#pPrice').value),description:$('#pDesc').value.trim(),trackStock:$('#pTrack').checked,stock:n0($('#pStock').value),minStock:n0($('#pMin').value),createdAt:p?.createdAt||now,updatedAt:now};if(p)db.products=db.products.map(x=>x.id===p.id?obj:x);else db.products.push(obj);saveLocal();closeModal();render();toast('Producto guardado','success')}}
function deleteProduct(id){const p=products().find(x=>x.id===id);if(!p)return;if(!confirm(`¿Eliminar "${p.name}" del catálogo? Los pedidos antiguos conservarán su descripción.`))return;db.products=db.products.map(x=>x.id===id?{...x,deletedAt:Date.now(),updatedAt:Date.now()}:x);saveLocal();closeModal();render();toast('Producto eliminado')}
function openStock(id){const p=products().find(x=>x.id===id);if(!p)return;const s=stockInfo(p);openModal('Reposición y ajuste de inventario',`<div class="panel" style="padding:14px"><div class="cell-primary">${esc(p.name)}</div><div class="info-row"><span>Stock inicial</span><strong>${s.initial}</strong></div><div class="info-row"><span>Movimientos registrados</span><strong>${s.adjustments}</strong></div><div class="info-row"><span>Comprometido / vendido</span><strong>${s.consumed}</strong></div><div class="info-row"><span>Disponible ahora</span><strong>${s.available}</strong></div></div><form id="stockForm" style="margin-top:19px"><div class="form-grid">${field('Cantidad a sumar o restar *','stQty',0,'number','required step="0.01"')}${field('Motivo del movimiento','stNote','Reposición de mercadería')}</div><p class="hint">Para descontar unidades por rotura o pérdida, ingresá una cantidad negativa (ej.: -2). Los pedidos ya se restan automáticamente.</p><div class="modal-actions"><button type="button" class="btn btn-outline" id="cancelStock">Cancelar</button><button class="btn btn-primary">Registrar movimiento</button></div></form>`);$('#cancelStock').onclick=closeModal;$('#stockForm').onsubmit=e=>{e.preventDefault();const q=num($('#stQty').value);if(!q)return toast('Ingresá una cantidad distinta de cero','error');const after=stockInfo(p).available+q;if(after<0&&!confirm('El stock quedará negativo. ¿Continuar?'))return;db.inventory.push({id:uid(),productId:id,qty:q,note:$('#stNote').value.trim(),createdAt:Date.now(),updatedAt:Date.now()});saveLocal();closeModal();render();toast('Stock actualizado','success')}}
function draftOrder(src,preferredBrand,preItem){const now=Date.now();const day=localDay();if(src)return structuredClone(src);return{id:uid(),number:nextOrderNumber(),customer:'',phone:'',brandId:preferredBrand||db.brands[0].id,createdAt:now,updatedAt:now,orderDate:day,dueDate:day,status:'pendiente',priority:'normal',deliveryMethod:'Retiro',paymentMethod:'Efectivo / Transferencia',notes:'',discount:0,shipping:0,deposit:0,items:[preItem?{id:uid(),productId:null,name:preItem.name||'Trabajo personalizado',qty:preItem.qty||1,unitPrice:preItem.unitPrice||0,unitCost:preItem.unitCost||0}:{id:uid(),productId:null,name:'',qty:1,unitPrice:0,unitCost:0}]}}

function openOrder(id=null,preferredBrand=null,preItem=null){const old=id?orders().find(o=>o.id===id):null;if(id&&!old)return toast('Pedido no encontrado','error');const d=draftOrder(old,preferredBrand,preItem);const customerNames=[...new Set(orders().map(o=>o.customer).filter(Boolean))];openModal(old?`Editar pedido ${orderCode(old)}`:'Nuevo pedido',`<form id="orderForm"><div class="form-grid cols-3">${field('Nombre del cliente *','oName',d.customer,'text','required maxlength="120" list="customerNames"')}<datalist id="customerNames">${customerNames.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>${field('Teléfono / WhatsApp','oPhone',d.phone,'tel','maxlength="45"')}${sfield('Emprendimiento / ticket','oBrand',selectBrands(),d.brandId)}${field('Fecha de pedido','oDate',d.orderDate,'date','required')}${field('Fecha de entrega','oDue',d.dueDate,'date','required')}${sfield('Estado','oStatus',Object.entries(STATUSES).map(([value,label])=>({value,label})),d.status)}${sfield('Prioridad','oPriority',[{value:'normal',label:'Normal'},{value:'alta',label:'Alta / Urgente'}],d.priority)}${sfield('Entrega','oDelivery',[{value:'Retiro',label:'Retira el cliente'},{value:'Envío',label:'Envío / entrega'}],d.deliveryMethod)}${field('Forma de pago','oPayment',d.paymentMethod)}</div>

const itemLines=$('#itemLines');const drawLines=()=>{itemLines.innerHTML=d.items.map(itemInputRow).join('');recalcOrderForm()};const readMoney=()=>{d.discount=n0($('#oDiscount').value);d.shipping=n0($('#oShipping').value);d.deposit=n0($('#oDeposit').value)};const recalcOrderForm=()=>{readMoney();const c=orderCalc(d);$('#orderSummary').innerHTML=`<div class="summary-line"><span>Subtotal</span><strong>${money(c.subtotal)}</strong></div><div class="summary-line"><span>Descuento</span><strong>− ${money(c.discount)}</strong></div><div class="summary-line"><span>Envío y extras</span><strong>+ ${money(c.shipping)}</strong></div><div class="summary-line total"><span>TOTAL</span><strong>${money(c.total)}</strong></div><div class="summary-line"><span>Seña / cobrado</span><strong>${money(c.deposit)}</strong></div><div class="summary-line"><span>Saldo pendiente</span><strong>${money(c.balance)}</strong></div>`;$$('.item-block').forEach((row,i)=>{const v=$('.item-total',row);if(v)v.textContent=money(n0(d.items[i].qty)*n0(d.items[i].unitPrice))})};
itemLines.oninput=e=>{const el=e.target;if(el.dataset.line===undefined)return;const i=Number(el.dataset.line),k=el.dataset.field;if(!d.items[i])return;d.items[i][k]=['qty','unitPrice','unitCost'].includes(k)?n0(el.value):el.value;recalcOrderForm()};itemLines.onchange=e=>{const el=e.target;if(el.dataset.field!=='productId')return;const i=Number(el.dataset.line),p=products().find(x=>x.id===el.value);if(p){d.items[i]={...d.items[i],productId:p.id,name:p.name,unitPrice:n0(p.price),unitCost:n0(p.cost)}}else d.items[i]={...d.items[i],productId:null,name:'',unitPrice:0,unitCost:0};drawLines()};itemLines.onclick=e=>{const bt=e.target.closest('[data-remove-line]');if(!bt)return;if(d.items.length<=1){toast('El pedido debe tener al menos un ítem','error');return}d.items.splice(Number(bt.dataset.removeLine),1);drawLines()};$('#addLine').onclick=()=>{d.items.push({id:uid(),productId:null,name:'',qty:1,unitPrice:0,unitCost:0});drawLines()};['oDiscount','oShipping','oDeposit'].forEach(id=>$('#'+id).addEventListener('input',recalcOrderForm));$('#cancelOrder').onclick=closeModal;

function renderSettings(){const c=configData();app.innerHTML=`<div class="heading-row"><div><div class="eyebrow">PERSONALIZACIÓN Y RESPALDOS</div><p class="section-text">Definí las marcas de los tickets y conectá tu repositorio privado de GitHub.</p></div></div><div class="panel"><div class="panel-header"><h3>Mis cuatro marcas</h3><small>El nombre se imprime en JPG y PDF</small></div><div class="setting-brands">${db.brands.map(brandSettingsPanel).join('')}</div><div class="modal-actions"><button class="btn btn-primary" id="saveBrands">Guardar marcas</button></div></div><div class="section-heading"><h3>Sincronización con GitHub</h3></div><div class="panel"><p class="section-text">La app funciona sin internet y guarda en este equipo. Si vinculás un <b>repositorio privado</b> con permiso para escribir archivos, podrás sincronizar automáticamente tus datos entre la computadora y el celular.</p><div class="sync-warning"><strong>Seguridad:</strong> creá un token <b>fine-grained</b> con acceso únicamente a ese repositorio y permiso <b>Contents: Read and write</b>. Ingresalo <b>solo en esta pantalla</b>, nunca por mensaje ni en archivos del proyecto. Para no guardarlo en el dispositivo, dejá desmarcada la opción de recordar token. Si un tercero accede al navegador con sesión abierta, puede utilizarlo.</div><div class="row-inline" style="margin:14px 0;gap:9px;flex-wrap:wrap"><a class="btn btn-outline btn-small" href="https://github.com/new?name=erkana-gestion-datos" target="_blank" rel="noopener noreferrer">1. Crear repo PRIVADO de datos ↗</a><a class="btn btn-outline btn-small" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">2. Generar token restringido ↗</a><a class="btn btn-outline btn-small" href="https://github.com/new?name=erkana-gestion-web" target="_blank" rel="noopener noreferrer">3. Crear repo para el programa ↗</a></div><p class="hint">Cuenta detectada: <b>leof566</b>. Al crear el repositorio de datos elegí <b>Private</b>, inicializalo con un README y concedé al token solo permiso <b>Contents: Read and write</b> para ese repositorio. El de código puede ser público porque no contendrá datos de clientes.</p><div class="form-grid cols-3">${field('Usuario o organización GitHub','ghOwner',c.owner,'text','autocomplete="off"')}${field('Repositorio privado','ghRepo',c.repo,'text','autocomplete="off"')}${field('Rama','ghBranch',c.branch,'text','autocomplete="off"')}${field('Archivo de datos (ruta)','ghPath',c.path,'text','autocomplete="off"')}<div class="field span-2"><label for="ghToken">Token de GitHub</label><input id="ghToken" type="password" autocomplete="off" placeholder="${getToken()?'Token ya configurado (dejar en blanco para conservarlo)':'github_pat_...'}"></div></div><label class="checkbox-field" style="margin-top:14px"><input type="checkbox" id="ghRemember" ${c.remember?'checked':''}> Guardar token en este dispositivo (menos seguro en equipos compartidos)</label><div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap"><span class="subtle">${hasCredentials()?'● Cuenta configurada — cambios locales pendientes hasta sincronizar':'○ No hay conexión configurada'}</span><div class="row-inline"><button class="btn btn-outline" id="disconnectGh">Desconectar</button><button class="btn btn-primary" id="saveGh">Guardar y sincronizar</button></div></div><p class="hint">Al guardar o modificar pedidos se programa la sincronización. Además, se comprueban novedades aproximadamente cada minuto mientras la app esté abierta y online. Si se modifica un mismo dato en dos equipos a la vez, prevalece la edición más reciente.</p></div><div class="section-heading"><h3>Copias de seguridad y exportaciones</h3></div><div class="panel"><p class="section-text">Descargá un respaldo completo con pedidos, productos y movimientos de stock. También podés restaurarlo en otro equipo. La importación <b>fusiona por identificador</b>, no borra los datos actuales.</p><div class="row-inline" style="margin-top:18px;flex-wrap:wrap"><button class="btn btn-outline" id="backupJSON">↓ Descargar respaldo JSON</button><button class="btn btn-outline" id="restoreBtn">↑ Importar respaldo</button><button class="btn btn-outline" id="exportAllOrders">↓ Pedidos CSV</button><input type="file" id="restoreInput" accept=".json,application/json" hidden></div></div>`;
$('#saveBrands').onclick=()=>{db.brands=db.brands.map(b=>({...b,name:$('#brandName_'+b.id).value.trim()||b.name,subtitle:$('#brandSub_'+b.id).value.trim(),phone:$('#brandPhone_'+b.id).value.trim(),alias:$('#brandAlias_'+b.id).value.trim(),footer:$('#brandFooter_'+b.id).value.trim(),updatedAt:Date.now()}));saveLocal();renderSettings();toast('Marcas actualizadas','success')};$('#saveGh').onclick=()=>{const next={owner:$('#ghOwner').value.trim(),repo:$('#ghRepo').value.trim(),branch:$('#ghBranch').value.trim()||'main',path:$('#ghPath').value.trim()||'data/gestion.json',remember:$('#ghRemember').checked};if(!/^[\w.-]+$/.test(next.owner)||!/^[\w.-]+$/.test(next.repo)||next.path.includes('..')||next.path.startsWith('/'))return toast('Revisá usuario, repositorio y ruta','error');const input=$('#ghToken').value.trim();if(input){sessionStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY);(next.remember?localStorage:sessionStorage).setItem(TOKEN_KEY,input)}else if(getToken()){const token=getToken();sessionStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY);(next.remember?localStorage:sessionStorage).setItem(TOKEN_KEY,token)}localStorage.setItem(GITHUB_KEY,JSON.stringify(next));setIndicator('Nube sin verificar','offline');syncNow(false).finally(()=>{if(view==='configuracion')renderSettings()})};$('#disconnectGh').onclick=()=>{if(!confirm('¿Desconectar GitHub de este equipo? Los datos locales se conservarán.'))return;localStorage.removeItem(GITHUB_KEY);localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(TOKEN_KEY);setIndicator('Guardado local');renderSettings();toast('GitHub desconectado')};$('#backupJSON').onclick=()=>downloadFile(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),`erkana-respaldo-${localDay()}.json`);$('#restoreBtn').onclick=()=>$('#restoreInput').click();$('#restoreInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.orders)||!Array.isArray(data.products))throw new Error('No es un respaldo válido');if(!confirm('¿Fusionar este respaldo con tu base de datos actual?'))return;db=mergeDB(db,data);saveLocal();renderSettings();toast('Respaldo importado','success')}catch(err){toast('No se pudo importar: '+err.message,'error')}};$('#exportAllOrders').onclick=exportOrders}
function canonical(d){const sort=arr=>(arr||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)));return JSON.stringify({version:1,orders:sort(d.orders),products:sort(d.products),inventory:sort(d.inventory),brands:sort(d.brands),settings:d.settings||{}})}
function mergeArray(a,b){const m=new Map();[...(b||[]),...(a||[])].forEach(x=>{if(!x||!x.id)return;const prev=m.get(x.id);if(!prev||num(x.updatedAt)>num(prev.updatedAt))m.set(x.id,x)});return [...m.values()]}
function mergeDB(a,b){const result={version:1,orders:mergeArray(a.orders,b.orders),products:mergeArray(a.products,b.products),inventory:mergeArray(a.inventory,b.inventory),brands:mergeArray(a.brands,b.brands),settings:num(a.settings?.updatedAt)>=num(b.settings?.updatedAt)?a.settings:b.settings};result.brands=DEFAULT_BRANDS.map(base=>({...base,...(result.brands||[]).find(x=>x.id===base.id)}));return result}
function utf8base64(str){const u=new TextEncoder().encode(str);let s='';for(let i=0;i<u.length;i+=4096)s+=String.fromCharCode(...u.slice(i,i+4096));return btoa(s)}
function fromBase64Utf8(v){const raw=atob(v.replace(/\s/g,'')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function gitUrl(c){return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`}
async function gitRequest(url,token,method='GET',body=null){const res=await fetch(url,{method,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!res.ok){const response=await res.text();if(res.status===401)throw Error('Token inválido o vencido (401)');if(res.status===403)throw Error('Sin permisos o límite de GitHub (403)');if(res.status===404)return{notFound:true};if(res.status===409||res.status===422)return{conflict:true,status:res.status};throw Error(`GitHub devolvió HTTP ${res.status}: ${response.slice(0,180)}`)}return res.json()}
async function syncNow(silent=false){if(syncWorking||!hasCredentials())return;if(!navigator.onLine){setIndicator('Sin conexión: local','offline');if(!silent)toast('Sin internet: los cambios siguen guardados en el equipo');return}const c=configData(),token=getToken();syncWorking=true;setIndicator('Sincronizando…','offline');try{const repoInfo=await gitRequest(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`,token);if(repoInfo.notFound||repoInfo.private!==true)throw Error('El repositorio de datos NO es privado. Cambiá su visibilidad a Private en GitHub antes de sincronizar.');for(let attempt=0;attempt<4;attempt++){const url=gitUrl(c),remote=await gitRequest(url+'?ref='+encodeURIComponent(c.branch),token);const existing=remote.notFound?freshDB():JSON.parse(fromBase64Utf8(remote.content||''));const merged=mergeDB(db,existing);db=merged;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){throw Error('No se pudieron guardar los datos fusionados: '+e.message)}if(remote.notFound||canonical(merged)!==canonical(existing)){const output=await gitRequest(url,token,'PUT',{message:`ERKANA gestión: sincronización ${new Date().toISOString()}`,content:utf8base64(JSON.stringify(merged)),branch:c.branch,...(!remote.notFound?{sha:remote.sha}:{})});if(output.conflict){if(attempt===3)throw Error('Hubo varias ediciones simultáneas. Intentá de nuevo.');continue}if(output.notFound)throw Error('Repositorio/rama no encontrado o sin permisos de escritura')}lastSyncedAt=new Date();setIndicator('Nube al día');if(!silent)toast('GitHub sincronizado correctamente','success');render();return} }catch(e){setIndicator('Error de nube — datos locales a salvo','error');if(!silent)toast('No se pudo sincronizar: '+e.message,'error');console.warn('Sync error:',e.message)}finally{syncWorking=false}}
function scheduleSync(){if(syncTimeout)clearTimeout(syncTimeout);if(!hasCredentials())return;syncTimeout=setTimeout(()=>syncNow(true),8500)}
function exportCsv(rows,filename){const content='\ufeff'+rows.map(row=>row.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');downloadFile(new Blob([content],{type:'text/csv;charset=utf-8'}),filename)}
function exportOrders(){exportCsv([['Nro','Cliente','WhatsApp','Marca','Fecha pedido','Fecha entrega','Estado','Detalle','Subtotal','Descuento','Envío','Total','Seña','Saldo','Costo estimado','Notas'],...orders().sort((a,b)=>a.number-b.number).map(o=>{const c=orderCalc(o);return[orderCode(o),o.customer,o.phone,brandName(o.brandId),o.orderDate,o.dueDate,STATUSES[o.status],o.items.map(x=>`${x.qty} x ${x.name}`).join(' | '),c.subtotal,c.discount,c.shipping,c.total,c.deposit,c.balance,c.cost,o.notes]})],`erkana-pedidos-${localDay()}.csv`)}
function exportProducts(){exportCsv([['Nombre','SKU','Marca','Categoría','Costo unitario','Precio unitario','Stock inicial','Movimientos','Consumido','Disponible','Stock mínimo'],...products().map(p=>{const s=stockInfo(p);return[p.name,p.sku,brandName(p.brandId),p.category,p.cost,p.price,p.stock,s.adjustments,s.consumed,p.trackStock?s.available:'No controla',p.minStock]})],`erkana-stock-${localDay()}.csv`)}
function downloadFile(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function ticketMarkup(o,b){const c=orderCalc(o);return `<div class="ticket-preview"><h2>${esc(b.name)}</h2><div class="center ticket-kicker">${esc(b.subtitle||'PERSONALIZADOS')}</div>${b.phone?`<p class="center" style="font-size:11px;margin:6px 0">WhatsApp: ${esc(b.phone)}</p>`:''}<div class="dash"></div><div class="center" style="font-weight:800;font-size:13px;letter-spacing:1px">${o.status==='presupuesto'?'PRESUPUESTO':'COMPROBANTE DE PEDIDO'}</div><div class="center" style="font-size:11px;color:#777;margin-top:5px">${orderCode(o)} · ${fmtDate(o.orderDate)}</div><div class="dash"></div><div class="info-row"><span>Cliente</span><strong>${esc(o.customer)}</strong></div>${o.phone?`<div class="info-row"><span>Teléfono</span><strong>${esc(o.phone)}</strong></div>`:''}<div class="info-row"><span>Entrega prevista</span><strong>${fmtDate(o.dueDate)}</strong></div><div class="info-row"><span>Estado</span><strong>${esc(STATUSES[o.status])}</strong></div><div class="dash"></div><table><thead><tr><td><b>Detalle</b></td><td style="text-align:right"><b>Total</b></td></tr></thead><tbody>${o.items.map(it=>`<tr><td>${esc(it.name)}<div style="color:#777;font-size:11px">${n0(it.qty)} × ${money(it.unitPrice)}</div></td><td style="text-align:right;vertical-align:top">${money(n0(it.qty)*n0(it.unitPrice))}</td></tr>`).join('')}</tbody></table><div class="dash"></div><div class="info-row"><span>Subtotal</span><strong>${money(c.subtotal)}</strong></div>${c.discount?`<div class="info-row"><span>Descuento</span><strong>− ${money(c.discount)}</strong></div>`:''}${c.shipping?`<div class="info-row"><span>Envío / extras</span><strong>+ ${money(c.shipping)}</strong></div>`:''}<div class="total-line" style="margin:14px 0"><span>TOTAL</span><span>${money(c.total)}</span></div><div class="info-row"><span>Seña / recibido</span><strong>${money(c.deposit)}</strong></div><div class="info-row"><span>Saldo pendiente</span><strong>${money(c.balance)}</strong></div>${b.alias?`<p class="center" style="font-size:11px;margin-top:19px">ALIAS PARA TRANSFERIR<br><b>${esc(b.alias)}</b></p>`:''}${o.notes?`<div class="dash"></div><p style="font-size:11px;white-space:pre-wrap">Observaciones: ${esc(o.notes)}</p>`:''}<div class="dash"></div><div class="center" style="font-size:12px;font-weight:750">${esc(b.footer||'¡Muchas gracias!')}</div><div class="center" style="font-size:9px;color:#999;margin-top:12px">Comprobante de pedido · No válido como factura fiscal</div></div>`}
function openTicket(id){const o=orders().find(x=>x.id===id);if(!o)return;openModal(`Ticket del pedido ${orderCode(o)}`,`<div class="field" style="margin:0 auto 15px;max-width:390px"><label>Marca que figurará en el ticket</label><select id="ticketBrand">${opts(selectBrands(),o.brandId)}</select></div><div id="ticketScreen">${ticketMarkup(o,brand(o.brandId))}</div><div class="modal-actions" style="justify-content:center;flex-wrap:wrap"><button class="btn btn-outline" id="ticketCopy">Copiar resumen</button><button class="btn btn-outline" id="ticketJpg">↓ JPG</button><button class="btn btn-primary" id="ticketPdf">↓ PDF</button><button class="btn btn-outline" id="ticketShare">Compartir ↗</button></div>`);$('#ticketBrand').onchange=()=>{$('#ticketScreen').innerHTML=ticketMarkup(o,brand($('#ticketBrand').value))};$('#ticketJpg').onclick=async()=>{const canvas=drawTicketCanvas(o,brand($('#ticketBrand').value));const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.94));if(blob)downloadFile(blob,`ticket-${o.number}-${$('#ticketBrand').value}.jpg`)};$('#ticketPdf').onclick=async()=>{const canvas=drawTicketCanvas(o,brand($('#ticketBrand').value));const pdf=pdfFromCanvas(canvas);downloadFile(pdf,`ticket-${o.number}-${$('#ticketBrand').value}.pdf`)};$('#ticketShare').onclick=async()=>{const canvas=drawTicketCanvas(o,brand($('#ticketBrand').value));const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.93));const file=new File([blob],`ticket-${o.number}.jpg`,{type:'image/jpeg'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:`Pedido ${orderCode(o)}`,text:`Ticket de ${brand($('#ticketBrand').value).name}`})}catch(err){if(err.name!=='AbortError')toast('No se pudo compartir: '+err.message,'error')}}else toast('En este dispositivo descargá el JPG y adjuntalo en WhatsApp')};$('#ticketCopy').onclick=async()=>{const c=orderCalc(o),text=`${brand($('#ticketBrand').value).name}\nPEDIDO ${orderCode(o)}\nCliente: ${o.customer}\nEntrega: ${fmtDate(o.dueDate)}\n${o.items.map(x=>`${x.qty} x ${x.name}: ${money(x.qty*x.unitPrice)}`).join('\n')}\nTOTAL: ${money(c.total)}\nSeña: ${money(c.deposit)}\nSaldo: ${money(c.balance)}`;try{await navigator.clipboard.writeText(text);toast('Resumen copiado','success')}catch{toast('No se pudo copiar automáticamente','error')}}}
function wrapText(ctx,text,maxWidth){const words=String(text).split(/\s+/).filter(Boolean);const lines=[],line=[];for(const word of words){if(ctx.measureText([...line,word].join(' ')).width<=maxWidth){line.push(word);continue}if(line.length){lines.push(line.join(' '));line.length=0}if(ctx.measureText(word).width<=maxWidth){line.push(word);continue}let s='';for(const ch of word){if(ctx.measureText(s+ch).width>maxWidth&&s){lines.push(s);s=''}s+=ch}if(s)line.push(s)}if(line.length)lines.push(line.join(' '));return lines.length?lines:['']}
function drawTicketCanvas(o,b){const c=orderCalc(o);const W=900,m=58,interior=W-m*2;const measure=document.createElement('canvas').getContext('2d');measure.font='25px Arial';const wrap=txt=>wrapText(measure,txt,interior-210);const itemHeight=o.items.reduce((s,it)=>s+(wrap(it.name).length*35+38),0);measure.font='22px Arial';const notesLines=o.notes?wrapText(measure,o.notes,interior):[];const H=1220+itemHeight+notesLines.length*32+(b.alias?100:0)+(b.phone?35:0);const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let y=60;const fg='#1a2236';const label='#718097';const write=(str,x,yy,size=25,weight='400',color=fg,align='left')=>{ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial, sans-serif`;ctx.textAlign=align;ctx.fillText(String(str),x,yy)};const horizontal=()=>{y+=16;ctx.strokeStyle='#b9c2d1';ctx.setLineDash([7,9]);ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(W-m,y);ctx.stroke();ctx.setLineDash([]);y+=42};const kv=(left,right)=>{write(left,m,y,23,'400',label);write(right,W-m,y,23,'700',fg,'right');y+=39};write(b.name,W/2,y,42,'800',fg,'center');y+=37;write(b.subtitle||'PRODUCTOS PERSONALIZADOS',W/2,y,20,'500',label,'center');y+=36;if(b.phone){write('WhatsApp '+b.phone,W/2,y,19,'400',label,'center');y+=27}horizontal();write(o.status==='presupuesto'?'PRESUPUESTO':'COMPROBANTE DE PEDIDO',W/2,y,28,'800',fg,'center');y+=35;write(`${orderCode(o)}   •   ${fmtDate(o.orderDate)}`,W/2,y,20,'400',label,'center');y+=14;horizontal();kv('CLIENTE',o.customer);if(o.phone)kv('TELÉFONO',o.phone);kv('ENTREGA',fmtDate(o.dueDate));kv('ESTADO',STATUSES[o.status]||o.status);horizontal();write('DESCRIPCIÓN',m,y,20,'750',label);write('IMPORTE',W-m,y,20,'750',label,'right');y+=42;
for(const it of o.items){ctx.font='500 25px Arial';const lines=wrapText(ctx,it.name,interior-210);lines.forEach((line,idx)=>{write(line,m,y,25,'600');if(idx===0)write(money(n0(it.qty)*n0(it.unitPrice)),W-m,y,24,'700',fg,'right');y+=34});write(`${n0(it.qty)} × ${money(it.unitPrice)}`,m,y,20,'400',label);y+=38}horizontal();kv('Subtotal',money(c.subtotal));if(c.discount)kv('Descuento','− '+money(c.discount));if(c.shipping)kv('Envío y extras','+ '+money(c.shipping));y+=9;write('TOTAL',m,y,34,'800');write(money(c.total),W-m,y,34,'800',fg,'right');y+=56;kv('Seña / cobrado',money(c.deposit));kv('SALDO PENDIENTE',money(c.balance));if(b.alias){y+=20;write('ALIAS / PAGO POR TRANSFERENCIA',W/2,y,19,'600',label,'center');y+=34;write(b.alias,W/2,y,26,'750',fg,'center');y+=10}if(notesLines.length){horizontal();write('NOTAS',m,y,20,'800',label);y+=32;notesLines.forEach(line=>{write(line,m,y,22);y+=30})}horizontal();write(b.footer||'¡Muchas gracias!',W/2,y,26,'700',fg,'center');y+=43;write('Comprobante de pedido · No válido como factura fiscal',W/2,y,17,'400',label,'center');const cropped=document.createElement('canvas');cropped.width=W;cropped.height=Math.min(H,Math.ceil(y+52));cropped.getContext('2d').drawImage(canvas,0,0);return cropped}
function pdfFromCanvas(canvas){/* PDF autocontenido: imagen JPEG embebida como XObject, sin bibliotecas ni CDN. */const jpeg=canvas.toDataURL('image/jpeg',.93).split(',')[1],raw=atob(jpeg),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const W=272,H=Math.max(150,W*canvas.height/canvas.width);const enc=new TextEncoder();let parts=[],cursor=0,offsets=[0];function add(s){const b=typeof s==='string'?enc.encode(s):s;parts.push(b);cursor+=b.length}function obj(id,body){offsets[id]=cursor;add(`${id} 0 obj\n${body}\nendobj\n`)}add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);const stream=`q\n${W.toFixed(2)} 0 0 ${H.toFixed(2)} 0 0 cm\n/Im0 Do\nQ\n`;obj(4,`<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}endstream`);offsets[5]=cursor;add(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);add(bytes);add('\nendstream\nendobj\n');const xref=cursor;add('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);return new Blob(parts,{type:'application/pdf'})}
app.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const {action,id,view:v,date}=btn.dataset;switch(action){case'go':navigate(v);break;case'quick-brand':openOrder(null,id);break;case'new-order':openOrder();break;case'edit-order':openOrder(id);break;case'delete-order':deleteOrder(id);break;case'duplicate-order':duplicateOrder(id);break;case'ticket':openTicket(id);break;case'new-product':openProduct();break;case'edit-product':openProduct(id);break;case'delete-product':deleteProduct(id);break;case'restock':openStock(id);break;case'prev-month':monthCursor.setMonth(monthCursor.getMonth()-1);renderCalendar();break;case'next-month':monthCursor.setMonth(monthCursor.getMonth()+1);renderCalendar();break;case'this-month':monthCursor=new Date();monthCursor.setDate(1);selectedDay=localDay();renderCalendar();break;case'select-day':selectedDay=date;const dt=new Date(date+'T12:00:00');monthCursor=new Date(dt.getFullYear(),dt.getMonth(),1);renderCalendar();break;case'export-orders':exportOrders();break;case'export-products':exportProducts();break}});
